# Portas só em 127.0.0.1: o banco tem senha fixa e, com DEMO_ADMIN=1, o gateway e o
# painel derrubam worker sem autenticação. Ninguém na rede local alcança.
services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: outbox
      POSTGRES_PASSWORD: outbox
      POSTGRES_DB: outbox
    ports: ["127.0.0.1:${PG_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "outbox"]
      interval: 1s
      retries: 30
    restart: unless-stopped

  mockprovider:
    build: .
    command: ["/mockprovider"]
    environment:
      LATENCY: ${MOCK_LATENCY:-80ms}
      JITTER: ${MOCK_JITTER:-120ms}
      FAIL_RATE: ${MOCK_FAIL_RATE:-0.05}
    ports: ["127.0.0.1:9090:9090"]
    restart: unless-stopped

  gateway:
    build: .
    command: ["/gateway"]
    environment:
      DATABASE_URL: postgres://outbox:outbox@postgres:5432/outbox
      PROVIDER_URL: http://mockprovider:9090/v1/messages
      WORKERS: ${WORKERS:-16}
      LEASE: ${LEASE:-10s}
      REAP_INTERVAL: 2s
      # rotas de derrubar worker e de redrive, só pra demo: nunca ligue em produção
      DEMO_ADMIN: ${DEMO_ADMIN:-0}
    ports: ["127.0.0.1:8080:8080"]
    # o shutdown espera o envio em voo (até LEASE/2) e as requisições (até 10 s)
    stop_grace_period: 20s
    depends_on:
      postgres: { condition: service_healthy }
      mockprovider: { condition: service_started }
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    ports: ["127.0.0.1:5180:8080"]
    depends_on:
      gateway: { condition: service_started }
    restart: unless-stopped

  k6:
    image: grafana/k6:1.3.0@sha256:3ddc8b1a33a2c3d8edc6e99b6a762ae36cba08788463458f5e6a7703e14eb77d
    profiles: ["load"]
    command: ["run", "/load/send.js"]
    environment:
      BASE_URL: http://gateway:8080
      RATE: ${RATE:-200}
      DURATION: ${DURATION:-60s}
      RECIPIENTS: ${RECIPIENTS:-1000}
    volumes: ["./load:/load:ro"]
