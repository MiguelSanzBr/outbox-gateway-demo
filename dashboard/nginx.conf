# Serve o build do painel e repassa /v1 pro gateway na mesma origem (sem CORS).
server {
    listen 8080;
    root /usr/share/nginx/html;

    # DNS do docker com validade curta: proxy_pass com variável resolve de novo, então
    # o gateway recriado com outro IP (compose up --build gateway) não deixa o painel em 502
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway http://gateway:8080;

    location /v1/ {
        proxy_pass $gateway;
    }

    # SSE: sem buffer, senão o evento fica parado no nginx; o ping de 15 s segura o read timeout de 60 s
    location = /v1/events {
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    location / {
        try_files $uri /index.html;
    }
}
