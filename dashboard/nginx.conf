# Serve o build do painel e repassa /v1 pro gateway na mesma origem (sem CORS).
server {
    listen 80;
    root /usr/share/nginx/html;

    location /v1/ {
        proxy_pass http://gateway:8080;
    }

    # SSE: sem buffer, senão o evento fica parado no nginx; o ping de 15 s segura o read timeout de 60 s
    location = /v1/events {
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    location / {
        try_files $uri /index.html;
    }
}
